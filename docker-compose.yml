version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: flowgenall-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: flowgenall
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - flowgenall-network

  redis:
    image: redis:7-alpine
    container_name: flowgenall-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - flowgenall-network

  minio:
    image: minio/minio:latest
    container_name: flowgenall-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - flowgenall-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: flowgenall-backend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: flowgenall
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - postgres
      - redis
      - minio
    networks:
      - flowgenall-network
    command: npm run start:dev

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  flowgenall-network:
    driver: bridge
